# Configuration Prometheus de référence pour flexwatch.
#
# Deux modes de découverte sont fournis :
#   - static_configs : le plus simple, pour un premier jet sur l'EC2 ;
#   - kubernetes_sd_configs : ce qu'on garde en régime k3s, où l'IP du pod
#     change à chaque redéploiement.
#
# Rappel de cohérence : scrape_interval (30 s) doit rester <= FLEX_POLL_INTERVAL,
# sinon on rate des transitions de gauges entre deux scrapes.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: flexwatch-mtl
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ----------------------------------------------------------- flexwatch (EC2)
  # À utiliser tant que l'app tourne en conteneur simple sur l'instance.
  - job_name: flexwatch-static
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:2112"]
        labels:
          app: flexwatch
          city: montreal

  # ----------------------------------------------------------- flexwatch (k3s)
  # Ne scrape que les pods explicitement annotés : sans ce filtre, Prometheus
  # tente de scraper tout le cluster, y compris ce qui n'expose rien.
  - job_name: flexwatch-k8s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [flexwatch]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # ------------------------------------------------------------- infrastructure
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Falco expose ses propres métriques : utile pour voir qu'il tourne ET pour
  # alerter sur le volume d'événements runtime (cf. PLAN.md phase 4).
  - job_name: falco
    static_configs:
      - targets: ["falco.falco.svc:8765"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
