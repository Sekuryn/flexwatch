# Configuration SonarQube — lue par sonarqube-scan-action (cf. ci.yml).
#
# IMPORTANT (SonarQube Cloud) : la couverture Go n'est PAS supportee par
# l'« Automatic Analysis ». Il faut la desactiver et utiliser l'analyse
# CI-based, sinon le scan echoue avec un conflit de methodes d'analyse.
# Administration > Analysis Method > Automatic Analysis : Off.
# La presence de ce fichier au moment de l'import aide : SonarQube Cloud en
# deduit qu'on veut du CI-based et propose directement le bon tutoriel.
sonar.projectKey=sekuryn_flexwatch
sonar.projectName=flexwatch
sonar.sourceEncoding=UTF-8

# Requis par SonarQube Cloud (inutile sur une instance auto-hebergee).
# Verifier la cle exacte dans l'UI : elle derive du compte GitHub mais n'est
# pas toujours identique.
sonar.organization=sekuryn

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Sonar lit directement le profil de couverture Go produit par `go test`.
sonar.go.coverage.reportPaths=coverage.out

# Ce qui n'est pas du code applicatif ne doit pas peser dans la note.
sonar.exclusions=\
  **/vendor/**,\
  terraform/**,\
  policy/**,\
  observability/**,\
  deploy/**,\
  scripts/**,\
  bin/**

# La quality gate porte sur le NOUVEAU code : un projet ne doit jamais
# régresser, même s'il reste de la dette ailleurs.
sonar.qualitygate.wait=true
