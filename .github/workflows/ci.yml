# CI flexwatch — qualité, sécurité, supply chain.
#
# Principe : tout ce qui casse la qualité casse le build (fail fast), et rien
# n'est publié sans SBOM ni signature. Aucun déploiement n'est fait ici : la
# CI produit un artefact signé, le déploiement reste manuel (cf. PLAN.md).
#
# Durcissement des actions : toutes sont EPINGLEES PAR SHA de commit, avec la
# version en commentaire. Un tag (@v7) est mutable — il peut etre repousse sur
# un autre commit — alors qu'un SHA ne l'est pas. C'est ce qui empeche qu'une
# action compromise s'execute avec les permissions de ce workflow.
#
# Pour mettre a jour : Dependabot ouvre une PR hebdomadaire groupee (elle met a
# jour le SHA ET le commentaire de version), ou en local :
#   go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0
#   pinact run .github/workflows/*.yml
#
# La regression est deja surveillee : SonarQube signale toute action non
# epinglee (githubactions:S7637) et c'est un check requis. `zizmor` complete
# l'audit des workflows (cf. PLAN.md phase 2).
name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  # Un scan hebdomadaire attrape les CVE publiées après le dernier commit :
  # le code ne change pas, la menace si.
  schedule:
    - cron: "17 4 * * 1"

# Principe du moindre privilège : par défaut, lecture seule. Chaque job
# ré-ouvre uniquement ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  # --------------------------------------------------------------- 1. qualité
  quality:
    name: format, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Profondeur complète : golangci-lint et Sonar veulent l'historique
          # pour attribuer les lignes (blame) et calculer le "new code".
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt (aucune diff toleree)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::fichiers non formates :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: tests (race detector + couverture)
        run: |
          # La couverture porte sur le code applicatif ; test/e2e/mockapi est
          # un outil de test et fausserait le chiffre.
          go test -race -count=1 ./...
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: resume de couverture
        run: go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # --------------------------------------------------------- 2. golangci-lint
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          args: --timeout=5m

  # -------------------------------------------- 3. vulnérabilités du code Go
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck croise le code réellement atteignable avec la base de
      # vulnérabilités Go : beaucoup moins de faux positifs qu'un scan de
      # go.mod, parce qu'une CVE dans une fonction jamais appelée n'est pas
      # exploitable.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          repo-checkout: false

  # ------------------------------------------------------- 4. secrets en clair
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Un token Telegram commité reste dans l'historique git même après
      # suppression : on veut le savoir au push, pas six mois plus tard.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ------------------------------------------ 5. dépendances & IaC (Trivy fs)
  trivy-repo:
    name: trivy (deps, IaC, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Version du binaire epinglee : celle par defaut de l'action prend du
          # retard, et un scanner en retard rate des CVE recentes.
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # Une CVE sans correctif disponible ne doit pas bloquer une PR :
          # elle est suivie, pas ignoree.
          ignore-unfixed: true
          # Exceptions nommees, justifiees et DATEES. Le format YAML n'est pas
          # detecte automatiquement, il faut le designer.
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  # ------------------------------------------------- 6. SonarQube quality gate
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [quality]
    # Sans instance Sonar configurée, on ne fait pas échouer la CI entière.
    if: ${{ vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      # Le blocage sur quality gate rouge est porte par la propriete
      # `sonar.qualitygate.wait=true` (cf. sonar-project.properties), qui est
      # la methode documentee par SonarSource : le scanner attend le verdict et
      # sort en erreur si la gate echoue.
      #
      # L'action `sonarqube-quality-gate-action` faisait doublon ici et
      # dependait du fichier `.scannerwork/report-task.txt` — une piece mobile
      # de plus pour le meme resultat.
      - name: scan sonarqube + attente de la quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ---------------------------------------- 7. image, SBOM, scan et signature
  image:
    name: build, sbom, sign
    runs-on: ubuntu-latest
    needs: [quality, lint, govulncheck, trivy-repo]
    permissions:
      contents: read
      packages: write # push GHCR
      id-token: write # cosign keyless (OIDC Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # github.repository conserve la casse du compte (p. ex. « Sekuryn/... »),
      # or un nom d'image OCI doit etre entierement en minuscules : sans cette
      # normalisation, le push GHCR et cosign echouent avec un nom invalide.
      - name: nom d'image en minuscules
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: metadata (tags et labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      # On construit d'abord SANS pousser : on ne publie pas une image qu'on
      # n'a pas encore scannée.
      - name: build arm64 (cible EC2 t4g)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: flexwatch:ci
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy sur l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: flexwatch:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: sbom (syft, cyclonedx)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: flexwatch:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: login ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Le push réutilise le cache : rien n'est reconstruit, donc l'image
      # poussée est bien celle qui a été scannée.
      - name: push ghcr
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'

      # Signature keyless : pas de clé privée à stocker ni à faire tourner.
      # L'identité signataire est le workflow lui-même (OIDC GitHub), ce qui
      # se vérifie côté cluster par Kyverno (cf. PLAN.md phase 4).
      - name: signer l'image (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Le SBOM est signé et attaché à l'image : il voyage avec elle, il n'est
      # pas un fichier perdu dans un artefact de CI.
      - name: attacher et signer le SBOM
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      - name: rappel de verification
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Verifier depuis un poste :"
          echo "cosign verify ${IMAGE}@${DIGEST} \\"
          echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/ci.yml@.*' \\"
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"

  # ---------------------------------------- 8. validation des policies IaC/OPA
  policy:
    name: conftest (terraform + kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: installer conftest
        run: |
          CONFTEST_VERSION=0.56.0
          # -L suit les redirections : sans ces gardes, une redirection vers
          # http ferait passer le telechargement en clair.
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

      # Les policies sont testées elles-mêmes : une policy qui ne refuse rien
      # donne une fausse assurance.
      - name: tests unitaires des policies
        run: conftest verify --policy policy/

      - name: policies sur les manifests kubernetes
        run: conftest test --policy policy/kubernetes deploy/k8s/ --all-namespaces
        continue-on-error: false
