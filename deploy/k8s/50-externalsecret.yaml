# Secrets : AWS Secrets Manager -> External Secrets Operator -> Secret k8s.
#
# ATTENTION — CE FICHIER EST L'OPTION SECONDAIRE.
#
# Le chemin retenu par défaut est `deploy/scripts/flexwatch-secret-sync.sh`,
# exécuté sur l'hôte par un timer systemd, parce que l'instance interdit
# volontairement l'accès à l'IMDS depuis les conteneurs
# (http_put_response_hop_limit = 1). ESO ne peut donc pas utiliser le rôle de
# l'instance, et il ne reste que des clés AWS statiques — soit remplacer un
# secret par un secret plus puissant.
#
# Pour utiliser ESO malgré tout, il faut AU CHOIX :
#   - passer le hop limit à 2 et compenser par une NetworkPolicy qui interdit
#     169.254.0.0/16 dans tous les namespaces sauf external-secrets ;
#   - ou accepter les clés statiques ci-dessous, portées par un rôle IAM limité
#     au seul ARN du secret.
# Le raisonnement complet est dans PLAN.md phase 6.
#
# Le token Telegram n'existe en clair QUE dans Secrets Manager et en mémoire
# du pod. Il n'est ni dans git, ni dans un manifest, ni dans l'image, ni dans
# un `kubectl create secret` tapé à la main (qui finirait dans l'historique du
# shell). La rotation se fait dans Secrets Manager : l'opérateur resynchronise
# tout seul au bout de `refreshInterval` (cf. PLAN.md phase 6).
#
# Prérequis (étapes manuelles du runbook) :
#   1. helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. un rôle IAM avec secretsmanager:GetSecretValue LIMITÉ à l'ARN du secret
#   3. les credentials de ce rôle dans le secret référencé ci-dessous
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: flexwatch
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: awssm-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: awssm-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flexwatch-telegram
  namespace: flexwatch
spec:
  # 1 h : compromis entre fraîcheur de rotation et appels API facturés.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # Nom du Secret k8s consommé par le Deployment.
    name: flexwatch-telegram
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_TOKEN
      remoteRef:
        key: flexwatch/telegram
        property: token
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: flexwatch/telegram
        property: chat_id
